name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest test_zedit -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed zedit.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: zedit-windows
          path: dist/zedit.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/zedit.exe
          --title "zedit ${{ github.ref_name }}"
          --notes "Windows build. Download zedit.exe below and run it directly - no installer, works under Wine."
