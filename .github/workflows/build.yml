name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish a release as (e.g. v1.0.0); empty = build only"
        required: false
        default: ""

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest test_zedit -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed zedit.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: zedit-windows
          path: dist/zedit.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >
          gh release create "$env:TAG" dist/zedit.exe
          --target "${{ github.sha }}"
          --title "zedit $env:TAG"
          --notes "Windows build. Download zedit.exe below and run it directly - no installer, works under Wine."
